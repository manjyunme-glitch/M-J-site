services:
  love-journal:
    build:
      context: .
      args:
        APP_COMMIT_SHA: "${APP_COMMIT_SHA:-}"
        APP_COMMIT_DATE: "${APP_COMMIT_DATE:-}"
        APP_COMMIT_REF: "${APP_COMMIT_REF:-}"
    pull_policy: build
    container_name: manjyun-jshaorii-love-journal
    restart: unless-stopped
    network_mode: bridge
    environment:
      PORT: 1314
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_PATH: /app/data/love-journal.db
      UPLOAD_DIR: /app/uploads
      SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH:?SITE_PASSWORD_HASH is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: ${APP_HTTP_PROXY:-http://192.168.0.113:9890}
      HTTPS_PROXY: ${APP_HTTPS_PROXY:-http://192.168.0.113:9890}
      NO_PROXY: ${APP_NO_PROXY:-localhost,127.0.0.1,::1}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-manjyunme-glitch/M-J-site}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "1314:1314"
    volumes:
      - ${DATA_PATH:-/share/DockerData/M-J-site/data}:/app/data
      - ${UPLOAD_PATH:-/share/DockerData/M-J-site/uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1314/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
